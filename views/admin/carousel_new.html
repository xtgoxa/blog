<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); color: #2c3e50; padding: 20px 30px; margin-bottom: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav { display: flex; gap: 15px; }
        .nav a { color: #667eea; text-decoration: none; font-weight: 500; padding: 8px 16px; border-radius: 20px; transition: all 0.3s; }
        .nav a:hover { background: #f0f3ff; }
        
        .form-container { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 600; color: #2c3e50; font-size: 15px; }
        .form-group input, .form-group textarea, .form-group select { 
            width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { 
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-group textarea { min-height: 100px; resize: vertical; font-family: inherit; }
        .form-group .hint { font-size: 13px; color: #95a5a6; margin-top: 8px; }
        
        .checkbox-group { display: flex; align-items: center; gap: 12px; }
        .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        .checkbox-group label { margin: 0; cursor: pointer; }
        
        .form-actions { margin-top: 30px; display: flex; gap: 15px; }
        .btn { padding: 14px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; text-decoration: none; border-radius: 25px; border: none; cursor: pointer; font-weight: 600; font-size: 16px; transition: transform 0.3s, box-shadow 0.3s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-success { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); }
        .btn-secondary { background: #95a5a6; }
        
        .image-preview { margin-top: 15px; border-radius: 12px; overflow: hidden; max-height: 200px; }
        .image-preview img { width: 100%; max-height: 200px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ 新建轮播图</h1>
            <div class="nav">
                <a href="/admin/carousel">← 返回列表</a>
            </div>
        </div>

        <div class="form-container">
            <form method="POST" action="/admin/carousel/new">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <div class="form-group">
                    <label for="title">📝 标题 *</label>
                    <input type="text" id="title" name="title" required placeholder="轮播图标题">
                </div>
                
                <div class="form-group">
                    <label for="subtitle">📄 副标题</label>
                    <textarea id="subtitle" name="subtitle" placeholder="轮播图描述文字"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="image_url">🖼️ 图片地址</label>
                    <input type="url" id="image_url" name="image_url" placeholder="https://example.com/image.jpg">
                    <p class="hint">建议尺寸：1200x400 像素。留空则使用渐变背景。</p>
                </div>
                
                <div class="form-group">
                    <label for="button_text">🔘 按钮文字</label>
                    <input type="text" id="button_text" name="button_text" placeholder="了解更多">
                </div>
                
                <div class="form-group">
                    <label for="button_link">🔗 按钮链接</label>
                    <input type="text" id="button_link" name="button_link" placeholder="/about 或 https://...">
                </div>
                
                <div class="form-group">
                    <label for="sort_order">📊 排序权重</label>
                    <input type="number" id="sort_order" name="sort_order" value="1" min="1">
                    <p class="hint">数字越小越靠前</p>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_active" name="is_active" checked>
                        <label for="is_active">立即启用</label>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-success">✅ 创建轮播图</button>
                    <a href="/admin/carousel" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
